<div class="login-shell">
  <section class="brand-pane">
    <div class="brand-content">
      <p class="brand-kicker">MerkaMundo</p>
      <h1>Portal Comercial</h1>
      <p class="brand-copy">Controla tus ventas, productos y operaciones diarias en un solo lugar.</p>
    </div>
  </section>

  <section class="form-pane">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Iniciar Sesión</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Usuario</mat-label>
            <input matInput formControlName="username" placeholder="Ej. admin" autocomplete="username">
            <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
              El usuario es requerido.
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contraseña</mat-label>
            <input matInput [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="current-password">
            <button mat-icon-button matSuffix type="button" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'">
              <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              La contraseña es requerida.
            </mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" class="full-width">
            Ingresar
          </button>

        </form>
      </mat-card-content>
    </mat-card>
  </section>
</div>
