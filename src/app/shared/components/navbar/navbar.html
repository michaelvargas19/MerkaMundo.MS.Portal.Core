<mat-toolbar color="primary" class="main-navbar">
  <span>MerkaMundo</span>

  <span class="spacer"></span>

  <div class="nav-links" *ngIf="isAuth$ | async">
    <a mat-button routerLink="/accounts" routerLinkActive="active-link">Usuarios</a>
    <a mat-button routerLink="/catalog/1" routerLinkActive="active-link">Catalogo</a>
    <a mat-button routerLink="/createSale" routerLinkActive="active-link">Crear venta</a>
    <a mat-button routerLink="/sales" routerLinkActive="active-link">Ventas</a>

    <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-btn">
      <mat-icon>account_circle</mat-icon>
      <span class="user-name">{{ userName }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu">
      <div class="menu-user-header" mat-menu-item disabled>
        <mat-icon>person</mat-icon>
        <span>{{ userName }}</span>
      </div>

      <mat-divider></mat-divider>

      <div mat-menu-item disabled class="menu-roles-label">Roles asignados</div>
      <div mat-menu-item disabled *ngFor="let role of roles" class="menu-role-item">
        <mat-icon>badge</mat-icon>
        <span>{{ role }}</span>
      </div>
      <div mat-menu-item disabled *ngIf="roles.length === 0" class="menu-role-item">
        <span>Sin roles asignados</span>
      </div>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="onLogout()">
        <mat-icon color="warn">logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>

<router-outlet></router-outlet>
